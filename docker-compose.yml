services:
  postgres:
    image: postgres:16-alpine
    container_name: aviation-platform-postgres
    environment:
      POSTGRES_DB: aviation
      POSTGRES_USER: aviation
      POSTGRES_PASSWORD: aviation
    ports:
      - "5433:5432"
    volumes:
      - aviation-platform-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aviation -d aviation"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aviation-platform-postgres-data:
