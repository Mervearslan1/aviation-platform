services:
  postgres:
    image: postgres:16-alpine
    container_name: aviation-platform-postgres
    environment:
      POSTGRES_DB: alp
      POSTGRES_USER: alp
      POSTGRES_PASSWORD: alp
    ports:
      - "5433:5432"
    volumes:
      - alp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alp -d alp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  alp-postgres-data:
