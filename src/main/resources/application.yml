spring:
  application:
    name: aviation-platform
  datasource:
    url: ${ALP_DB_URL:jdbc:postgresql://localhost:5433/alp}
    username: ${ALP_DB_USERNAME:alp}
    password: ${ALP_DB_PASSWORD:alp}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

springdoc:
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    persist-authorization: true
    display-request-duration: true
    try-it-out-enabled: true
    filter: true

alp:
  jwt:
    secret: ${ALP_JWT_SECRET:local-dev-only-change-me-32bytes-min-secret}
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
  seed:
    admin-email: ${ALP_ADMIN_EMAIL:}
    admin-password: ${ALP_ADMIN_PASSWORD:}
    admin-username: ${ALP_ADMIN_USERNAME:admin}
  media:
    directory: ${ALP_MEDIA_DIR:./data/media}
    max-image-bytes: 10485760
    max-video-bytes: 52428800
    max-audio-bytes: 20971520

logging:
  level:
    com.alp: INFO
